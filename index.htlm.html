    els.nodeActionBar.hidden = false;
  } else {
    els.nodeActionBar.hidden = true;
  }
}
function editLocked() {
  if (runState.status === 'running' || runState.status === 'paused' || runState.status === 'waiting') {
    toast('Ferma il programma (Stop) per modificare.', 'warn');
    return true;
  }
  return false;
}
function requestDelete(id) {
  if (!id || id === 'start' || id === 'end') return;
  if (editLocked()) return;
  const sub = collectSubtree(id);
  const finish = () => { deleteNodeById(id); renderAll(); toast('Blocco eliminato.'); };
  if (sub.length > 1) {
    openConfirm('Elimina blocco',
      'Questo blocco contiene ' + (sub.length - 1) + ' blocchi interni che verranno eliminati. Continuare?',
      'Elimina tutto', finish, true);
  } else finish();
}

/* ------------------------------ Eventi Touch, Pinch-to-Zoom e Click ------------------------------ */
function bindEvents() {
  // Tab bar inferiore
  document.querySelectorAll('.tab-item').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  // Barra azioni nodo selezionato
  els.nabEdit.addEventListener('click', () => {
    if (!selectedId || editLocked()) return;
    openEditor('edit', doc.nodes[selectedId].type, selectedId);
  });
  els.nabDel.addEventListener('click', () => {
    if (selectedId) requestDelete(selectedId);
  });

  // Tap e Double-Tap sui nodi
  let lastTapTime = 0, lastTapId = null;
  els.gNodes.addEventListener('click', e => {
    const g = e.target.closest('g.node');
    if (!g) return;
    const id = g.dataset.id;
    const now = Date.now();
    if (id === lastTapId && (now - lastTapTime) < 350) {
      // Doppio tap -> modifica diretta
      lastTapTime = 0;
      if (id === 'start' || id === 'end') { toast('Blocco fisso del programma.'); return; }
      if (!editLocked()) openEditor('edit', doc.nodes[id].type, id);
      return;
    }
    lastTapTime = now; lastTapId = id;
    if (id === 'start' || id === 'end') {
      selectNode(null);
      toast('Blocco fisso: ' + TYPE_META[doc.nodes[id].type].label);
    } else {
      selectNode(id);
    }
  });

  // Tap sulle frecce -> apre menu inserimento blocco
  els.gEdges.addEventListener('click', e => {
    const g = e.target.closest('g.edge');
    if (!g) return;
    const c = conns[+g.dataset.conn];
    if (!c || editLocked()) return;
    selectNode(null);
    openInsertMenu(c.ctx);
  });

  // Gestione Touch (Pan a 1 dito + Pinch-to-Zoom a 2 dita)
  let touchMode = null; // 'pan' | 'pinch'
  let panStart = null;
  let pinchStart = null;

  els.canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
      if (e.target.closest('g.node') || e.target.closest('g.edge')) return;
      touchMode = 'pan';
      panStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, vx: view.x, vy: view.y, moved: false };
    } else if (e.touches.length === 2) {
      touchMode = 'pinch';
      const t0 = e.touches[0], t1 = e.touches[1];
      const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
      const r = els.canvas.getBoundingClientRect();
      pinchStart = {
        dist,
        s: view.s,
        vx: view.x,
        vy: view.y,
        cx: (t0.clientX + t1.clientX) / 2 - r.left,
        cy: (t0.clientY + t1.clientY) / 2 - r.top
      };
    }
  }, { passive: true });

  els.canvas.addEventListener('touchmove', e => {
    if (touchMode === 'pan' && e.touches.length === 1 && panStart) {
      const dx = e.touches[0].clientX - panStart.x;
      const dy = e.touches[0].clientY - panStart.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) panStart.moved = true;
      if (panStart.moved) {
        view.x = panStart.vx + dx;
        view.y = panStart.vy + dy;
        applyView();
      }
    } else if (touchMode === 'pinch' && e.touches.length === 2 && pinchStart) {
      const t0 = e.touches[0], t1 = e.touches[1];
      const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
      const scaleFactor = dist / pinchStart.dist;
      const ns = Math.max(0.2, Math.min(3, pinchStart.s * scaleFactor));
      const k = ns / pinchStart.s;
      view.x = pinchStart.cx - (pinchStart.cx - pinchStart.vx) * k;
      view.y = pinchStart.cy - (pinchStart.cy - pinchStart.vy) * k;
      view.s = ns;
      applyView();
    }
  }, { passive: true });

  els.canvas.addEventListener('touchend', e => {
    if (touchMode === 'pan' && panStart && !panStart.moved && e.touches.length === 0) {
      selectNode(null);
    }
    if (e.touches.length === 0) {
      touchMode = null; panStart = null; pinchStart = null;
    }
  });

  // Fallback mouse per test su desktop
  let mousePan = null;
  els.canvas.addEventListener('mousedown', e => {
    if (e.target.closest('g.node') || e.target.closest('g.edge') || e.button !== 0) return;
    mousePan = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false };
  });
  window.addEventListener('mousemove', e => {
    if (!mousePan) return;
    const dx = e.clientX - mousePan.x, dy = e.clientY - mousePan.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) mousePan.moved = true;
    if (mousePan.moved) { view.x = mousePan.vx + dx; view.y = mousePan.vy + dy; applyView(); }
  });
  window.addEventListener('mouseup', () => {
    if (mousePan && !mousePan.moved) selectNode(null);
    mousePan = null;
  });

  // Chiusura bottom sheet e modali
  els.sheetBackdrop.addEventListener('click', e => { if (e.target === els.sheetBackdrop) closeMenus(); });
  els.modalBackdrop.addEventListener('click', e => { if (e.target === els.modalBackdrop) closeModal(); });

  // Form Console Input
  els.consoleForm.addEventListener('submit', e => {
    e.preventDefault();
    if (!inputWait) return;
    const raw = els.consoleInput.value;
    els.consoleInput.value = '';
    if (!raw.trim()) {
      appendConsole('err', 'Valore vuoto: scrivi qualcosa.');
      els.consoleInput.focus();
      return;
    }
    const w = inputWait;
    inputWait = null;
    deactivateInput();
    w.resolve({ raw });
  });

  // Pulsanti Toolbar
  els.btnPlay.addEventListener('click', () => {
    const s = runState.status;
    if (s === 'running') { runState.mode = 'pause'; return; }
    if (s === 'paused') { runState.mode = 'run'; if (proceedResolve) proceedResolve(); return; }
    if (s === 'idle') startExecution('run');
  });
  els.btnStep.addEventListener('click', () => {
    const s = runState.status;
    if (s === 'idle') { startExecution('step'); return; }
    if (s === 'paused') { runState.mode = 'step'; if (proceedResolve) proceedResolve(); }
  });
  els.btnStop.addEventListener('click', () => { if (runState.status !== 'idle') abortRun(); });

  els.btnNew.addEventListener('click', () => {
    if (editLocked()) return;
    openConfirm('Nuovo diagramma', 'Vuoi cancellare il diagramma attuale e crearne uno vuoto?', 'Nuovo', () => {
      doc = createEmptyDoc(); selectNode(null); runState.errorId = null;
      renderAll(); fitView(); clearConsole();
      appendConsole('sys', 'Nuovo diagramma creato.');
    });
  });
  els.btnExample.addEventListener('click', () => {
    if (editLocked()) return;
    openConfirm('Carica esempio', 'Sostituire il diagramma con l\'esempio (somma da 1 a n)?', 'Carica', () => {
      doc = exampleDoc(); selectNode(null); runState.errorId = null;
      renderAll(); fitView(); clearConsole();
      appendConsole('sys', 'Esempio caricato: premi Esegui.');
    });
  });
  els.btnExport.addEventListener('click', exportJson);
  els.btnImport.addEventListener('click', () => { if (!editLocked()) els.fileInput.click(); });
  els.btnCpp.addEventListener('click', openCpp);
  els.btnGuide.addEventListener('click', openGuide);
  els.btnClearConsole.addEventListener('click', clearConsole);
  els.speedRange.addEventListener('input', () => {
    els.speedLabel.textContent = SPEED_NAMES[+els.speedRange.value] || '';
  });
  els.zoomIn.addEventListener('click', () => { const r = els.canvasWrap.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1.25); });
  els.zoomOut.addEventListener('click', () => { const r = els.canvasWrap.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 0.8); });
  els.zoomFit.addEventListener('click', fitView);

  els.fileInput.addEventListener('change', () => {
    const f = els.fileInput.files && els.fileInput.files[0];
    els.fileInput.value = '';
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const validated = validateDoc(JSON.parse(rd.result));
        openConfirm('Importa file', 'Sostituire il diagramma attuale con il file selezionato?', 'Importa', () => {
          doc = validated; selectNode(null); runState.errorId = null;
          renderAll(); fitView();
          toast('Diagramma importato!');
        });
      } catch (err) {
        toast('Errore file: ' + err.message, 'err');
      }
    };
    rd.readAsText(f);
  });
}

/* ------------------------------ Esporta / Importa JSON ------------------------------ */
function exportJson() {
  const PARAMS = {
    declare: ['name', 'varType', 'isArray', 'size'],
    assign: ['var', 'expr'],
    input: ['var'],
    output: ['expr', 'newline'],
    if: ['cond'],
    while: ['cond'],
    for: ['var', 'from', 'to', 'step'],
  };
  const out = { app: 'flowgorithm-web', version: 1, nextId: doc.nextId, nodes: {} };
  for (const id of Object.keys(doc.nodes)) {
    const n = doc.nodes[id];
    const c = { id: n.id, type: n.type };
    if (n.next) c.next = n.next;
    if (n.type === 'if') { if (n.trueNext) c.trueNext = n.trueNext; if (n.falseNext) c.falseNext = n.falseNext; }
    if (n.type === 'while' || n.type === 'for') { if (n.body) c.body = n.body; }
    for (const k of (PARAMS[n.type] || [])) c[k] = n[k];
    out.nodes[id] = c;
  }
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'diagramma-flowgorithm.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast('File JSON scaricato!');
}

function validateDoc(data) {
  const fail = m => { throw new FlowError(m); };
  if (!data || typeof data !== 'object' || !data.nodes || typeof data.nodes !== 'object') fail('File non valido');
  const src = data.nodes;
  if (!src.start || !src.end) fail('Mancano i blocchi start/end');
  if (Object.keys(src).length > MAX_NODES + 2) fail('Troppi blocchi');
  const nodes = {};
  const refOk = v => typeof v === 'string' && v && v !== 'start' && src[v];
  for (const id of Object.keys(src)) {
    const sn = src[id] || {};
    let type = id === 'start' ? 'start' : (id === 'end' ? 'end' : sn.type);
    if (!TYPE_META[type]) fail('Blocco sconosciuto: ' + sn.type);
    const n = { id, type };
    if (refOk(sn.next) && sn.next !== id) n.next = sn.next;
    if (type === 'if') {
      if (refOk(sn.trueNext) && sn.trueNext !== id) n.trueNext = sn.trueNext;
      if (refOk(sn.falseNext) && sn.falseNext !== id) n.falseNext = sn.falseNext;
    }
    if ((type === 'while' || type === 'for') && refOk(sn.body) && sn.body !== id) n.body = sn.body;
    switch (type) {
      case 'start': n.next = (!n.next || n.next === 'start') ? 'end' : n.next; break;
      case 'end': n.next = null; break;
      case 'declare':
        n.name = String(sn.name != null ? sn.name : 'x');
        n.varType = VAR_TYPES[sn.varType] ? sn.varType : 'Integer';
        n.isArray = !!sn.isArray;
        n.size = Math.max(1, Math.min(MAX_ARRAY, parseInt(sn.size, 10) || 1));
        break;
      case 'assign': n.var = String(sn.var != null ? sn.var : 'x'); n.expr = String(sn.expr != null ? sn.expr : '0'); break;
      case 'input': n.var = String(sn.var != null ? sn.var : 'x'); break;
      case 'output': n.expr = String(sn.expr != null ? sn.expr : '""'); n.newline = sn.newline !== false; break;
      case 'if': case 'while': n.cond = String(sn.cond != null ? sn.cond : 'vero'); break;
      case 'for':
        n.var = String(sn.var != null ? sn.var : 'i');
        n.from = String(sn.from != null ? sn.from : '0');
        n.to = String(sn.to != null ? sn.to : '10');
        n.step = String(sn.step != null ? sn.step : '1');
        break;
    }
    nodes[id] = n;
  }
  nodes.start.next = nodes[nodes.start.next] ? nodes.start.next : 'end';
  nodes.end.next = null;
  computeContinuations(nodes);
  let nextId = 1;
  for (const id of Object.keys(nodes)) {
    const m = /^n(\d+)$/.exec(id);
    if (m) nextId = Math.max(nextId, Number(m[1]) + 1);
  }
  return { nextId, nodes };
}

/* ------------------------------ Avvio ------------------------------ */
function init() {
  grabEls();
  injectFontStyle();
  bindEvents();
  els.zoomFit.innerHTML = ICONS.fit;
  els.speedLabel.textContent = SPEED_NAMES[+els.speedRange.value] || '';
  deactivateInput();
  doc = exampleDoc();
  renderAll();
  fitView();
  refreshToolbar();
  appendConsole('sys', 'Benvenuto! Diagramma di esempio caricato. Premi Esegui per avviarlo.');
}
init();
</script>
